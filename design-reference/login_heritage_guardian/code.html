<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Culinary Heritage - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect">

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">

        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-fixed": "#1c1b1b",
                        "surface-bright": "#fbf9f4",
                        "on-surface-variant": "#444748",
                        "background": "#fbf9f4",

                        "surface": "#fbf9f4",
                        "on-error-container": "#93000a",
                        "tertiary-fixed-dim": "#b1c5ff",

                        "surface-container-low": "#f5f3ee",
                        "on-tertiary-container": "#6782c6",
                        "inverse-primary": "#c8c6c5",
                        "primary-container": "#1c1b1b",
                        "error-container": "#ffdad6",
                        "on-background": "#1b1c19",
                        "on-tertiary": "#ffffff",
                        "on-error": "#ffffff",
                        "secondary": "#a04100",
                        "tertiary": "#000000",
                        "tertiary-fixed": "#dae2ff",
                        "secondary-fixed-dim": "#ffb693",
                        "on-secondary": "#ffffff",
                        "on-tertiary-fixed": "#001946",
                        "surface-tint": "#5f5e5e",
                        "on-secondary-fixed": "#351000",
                        "on-secondary-fixed-variant": "#7a2f00",
                        "secondary-container": "#fe7f3b",
                        "outline-variant": "#c4c7c7",
                        "surface-container-lowest": "#ffffff",
                        "tertiary-container": "#001946",
                        "surface-container-high": "#eae8e3",
                        "on-surface": "#1b1c19",
                        "outline": "#747878",
                        "on-tertiary-fixed-variant": "#264484",
                        "inverse-surface": "#30312e",
                        "primary-fixed": "#e5e2e1",
                        "on-primary-container": "#858383",
                        "error": "#ba1a1a",
                        "surface-dim": "#dbdad5",

                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "margin-mobile": "20px",
                        "gutter-mobile": "16px",
                        "gutter-desktop": "32px",
                        "unit": "8px",
                        "container-max": "1280px",
                        "margin-desktop": "64px"
                    },
                    "fontFamily": {
                        "body-lg": ["Public Sans"],
                        "label-caps": ["Public Sans"],
                        "body-md": ["Public Sans"],
                        "headline-sm": ["Playfair Display"],
                        "headline-md": ["Playfair Display"],
                        "display-lg-mobile": ["Playfair Display"],
                        "display-lg": ["Playfair Display"]
                    },
                    "fontSize": {

                        "label-caps": ["12px", { "lineHeight": "1.2", "letterSpacing": "0.1em", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "headline-sm": ["24px", { "lineHeight": "1.4", "fontWeight": "600" }],
                        "headline-md": ["32px", { "lineHeight": "1.3", "fontWeight": "600" }],

                        "display-lg": ["64px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Tactile Parchment Subtlety via pure CSS */
        .bg-parchment-pattern {
            background-color: #fbf9f4; /* surface-bright */
            background-image: 
                radial-gradient(#e4e2dd 1px, transparent 1px),
                radial-gradient(#e4e2dd 1px, transparent 1px);
            background-position: 0 0, 10px 10px;
            background-size: 20px 20px;
            opacity: 0.8;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background min-h-screen flex flex-col items-center justify-center font-body-md text-on-surface relative overflow-hidden">
<!-- Background Pattern Layer -->
<div class="absolute inset-0 bg-parchment-pattern pointer-events-none z-0"></div>
<!-- Top Decorative Element -->
<div class="absolute top-0 w-full h-24 bg-gradient-to-b from-surface-variant/30 to-transparent pointer-events-none z-0"></div>
<main class="w-full max-w-md px-margin-mobile md:px-0 z-10 relative">
<!-- Header Section -->
<header class="text-center mb-12">
<!-- Brand Icon -->
<div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-surface-container border border-outline-variant mb-6 shadow-sm">
<span class="material-symbols-outlined text-3xl text-secondary" style="font-variation-settings: 'FILL' 1;">
                    museum
                </span>
</div>
<h1 class="font-headline-md text-headline-md text-primary mb-2">Welcome Back, Guardian</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Enter the archive to continue your curation.</p>
</header>
<!-- Form Section -->
<form class="space-y-8 bg-surface-bright/80 backdrop-blur-md p-8 rounded-xl border border-outline-variant/50 shadow-[0_4px_24px_-4px_rgba(0,0,0,0.04)]">
<!-- Input: Email/Phone -->
<div class="relative group">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-2 uppercase" for="identifier">Mobile Number or Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-0 top-1/2 -translate-y-1/2 text-outline-variant group-focus-within:text-secondary transition-colors">
                        person
                    </span>
<input class="w-full bg-transparent border-0 border-b border-outline-variant py-2 pl-8 pr-0 text-on-surface font-body-md text-body-md focus:ring-0 focus:border-secondary transition-colors placeholder:text-outline/50" id="identifier" name="identifier" placeholder="guardian@archives.in" type="text">
</div>
</div>
<!-- Input: Password -->
<div class="relative group">
<div class="flex justify-between items-end mb-2">
<label class="block font-label-caps text-label-caps text-on-surface-variant uppercase" for="password">Password</label>
<a class="font-headline-sm text-[14px] text-secondary hover:text-secondary-container transition-colors italic" href="#">Forgot Password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-0 top-1/2 -translate-y-1/2 text-outline-variant group-focus-within:text-secondary transition-colors">
                        lock
                    </span>
<input class="w-full bg-transparent border-0 border-b border-outline-variant py-2 pl-8 pr-10 text-on-surface font-body-md text-body-md focus:ring-0 focus:border-secondary transition-colors" id="password" name="password" placeholder="••••••••" type="password">
<button aria-label="Toggle password visibility" class="absolute right-0 top-1/2 -translate-y-1/2 text-outline-variant hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">
                            visibility
                        </span>
</button>
</div>
</div>
<!-- Primary CTA -->
<div class="pt-4">
<button class="w-full bg-secondary text-on-secondary py-4 rounded-sm font-label-caps text-label-caps uppercase tracking-widest hover:bg-on-secondary-fixed transition-colors flex items-center justify-center gap-2 group" type="submit">
<span>Enter the Archive</span>
<span class="material-symbols-outlined text-[18px] group-hover:translate-x-1 transition-transform">
                        arrow_forward
                    </span>
</button>
</div>
</form>
<!-- Social Login Divider -->
<div class="my-8 flex items-center justify-center">
<div class="h-px bg-outline-variant w-full"></div>
<span class="px-4 font-body-md text-body-md text-on-surface-variant bg-background">or</span>
<div class="h-px bg-outline-variant w-full"></div>
</div>
<!-- Social Login Options -->
<div class="flex flex-col gap-4">
<!-- Google -->
<button class="w-full bg-surface-container-lowest border border-outline-variant py-3 rounded-lg flex items-center justify-center gap-3 hover:bg-surface-container-low transition-colors text-on-surface font-body-md text-body-md" type="button">
<svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                Continue with Google
            </button>
<!-- Apple -->
<button class="w-full bg-surface-container-lowest border border-outline-variant py-3 rounded-lg flex items-center justify-center gap-3 hover:bg-surface-container-low transition-colors text-on-surface font-body-md text-body-md" type="button">
<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M16.365 7.112c.796-.967 1.332-2.316 1.186-3.664-1.156.046-2.585.768-3.411 1.734-.734.846-1.374 2.226-1.206 3.535 1.295.101 2.635-.638 3.431-1.605zm-4.484 4.095c-.156 2.766 2.378 3.738 2.408 3.748-.023.075-.378 1.298-1.22 2.531-.726 1.066-1.488 2.126-2.678 2.146-1.171.02-1.554-.694-2.883-.694-1.33 0-1.751.674-2.883.714-1.173.04-2.034-1.139-2.766-2.193-1.5-2.164-2.646-6.108-1.121-8.756.757-1.312 2.083-2.144 3.528-2.164 1.134-.02 2.204.764 2.883.764.678 0 1.968-.934 3.328-.795 1.411.059 2.697.568 3.491 1.732-2.981 1.738-2.483 5.867.417 6.967h-.002z"></path>
</svg>
                Continue with Apple
            </button>
</div>
</main>
<!-- Bottom Decorative Line -->
<div class="fixed bottom-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-secondary/20 to-transparent z-0"></div>
</body></html>
