<!-- Simple Script for Dynamic Form Behavior -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('ingredients-container');
            const addBtn = document.getElementById('add-ingredient-btn');
            
            // Get the last item to use as a template (the empty one)
            const template = container.lastElementChild.cloneNode(true);
            
            // Ensure the template inputs are clear
            const inputs = template.querySelectorAll('input:not([type="checkbox"])');
            inputs.forEach(input => input.value = '');
            
            const selects = template.querySelectorAll('select');
            selects.forEach(select => select.selectedIndex = 0);

            const checkboxes = template.querySelectorAll('input[type="checkbox"]');
            checkboxes.forEach(cb => cb.checked = false);

            addBtn.addEventListener('click', () => {
                const newNode = template.cloneNode(true);
                
                // Add event listener to the new remove button
                const removeBtn = newNode.querySelector('.remove-btn');
                if(removeBtn) {
                    removeBtn.style.display = 'block'; // Ensure it's visible
                    removeBtn.addEventListener('click', function() {
                        this.closest('.ingredient-entry').remove();
                        updateRemoveButtons();
                    });
                }
                
                container.appendChild(newNode);
                updateRemoveButtons();
                
                // Optional: Scroll slightly to show new input
                window.scrollBy({ top: 150, behavior: 'smooth' });
            });

            // Make sure the first item's remove button is hidden if it's the only one
            function updateRemoveButtons() {
                const entries = document.querySelectorAll('.ingredient-entry');
                entries.forEach((entry, index) => {
                    const btn = entry.querySelector('.remove-btn');
                    if (btn) {
                        // Allow removing any except if it's the very last one remaining
                        btn.style.display = entries.length > 1 ? 'block' : 'none';
                    }
                });
            }
            
            updateRemoveButtons();
        });
    </script>
